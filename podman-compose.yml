version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: containerfiles/Containerfile.api
    container_name: kaio-api
    image: localhost/kaio-portfolio-api:latest
    # host network: container uses host DNS directly (required for IPv6-only VPS)
    network_mode: host
    # Explicit DNS fallback for Hetzner IPv6-only VPS (in case bridge mode is used)
    dns:
      - 2a01:4ff:ff00::add:1
      - 2a01:4ff:ff00::add:2
    env_file:
      - .env
    environment:
      - ENV=production
      - PROMETHEUS_ENABLED=true
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
