version: '3.8'

services:
  kaio-portfolio:
    build:
      context: .
      dockerfile: Containerfile
    container_name: kaio-portfolio-api
    image: kaio-portfolio:latest
    ports:
      - "8000:8000"
    environment:
      # Production settings
      - ENV=production
      - BASE_URL=https://kaio.ia.br
      - PROMETHEUS_ENABLED=true

      # API Keys (override with secrets in production)
      - GROQ_API_KEY=${GROQ_API_KEY}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY}
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}

      # Rate limiting
      - RATE_LIMIT_MONTHLY=15

    volumes:
      # Persist ML model artifacts and quota data
      - ./data:/app/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Resource limits (adjust based on VPS specs)
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    # Security
    security_opt:
      - no-new-privileges:true
    read_only: false  # Need write for data/ directory

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: kaio-portfolio-net
